<div class="page-header mb-4">
  <h1 class="h3 mb-0">{{ 'dashboard.title' | translate }}</h1>
</div>

@if (user(); as current) {
  <div class="row g-3">
    <div class="col-md-8">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <h2 class="h5">{{ 'dashboard.welcome' | translate:{ name: current.firstName } }}</h2>
          <p class="text-muted mb-0">{{ current.email }}</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <h3 class="h6 text-uppercase text-muted">{{ 'dashboard.roles' | translate }}</h3>
          <div class="d-flex flex-wrap gap-2 mt-2">
            @for (role of current.roles; track role) {
              <span class="badge text-bg-primary">{{ role }}</span>
            } @empty {
              <span class="text-muted">{{ 'dashboard.noRoles' | translate }}</span>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
}
