<div class="admin-shell d-flex min-vh-100">
  <aside class="sidebar border-end bg-white" [class.collapsed]="!sidebarOpen()">
    <div class="sidebar-brand px-3 py-3 border-bottom">
      <i class="bi bi-mortarboard-fill text-primary me-2"></i>
      <span class="brand-text fw-semibold">{{ 'app.brand' | translate }}</span>
    </div>
    <app-sidebar-navigation />
  </aside>

  <div class="shell-main flex-grow-1 d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand navbar-light bg-white border-bottom px-3">
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm me-3"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar">
        <i class="bi bi-list"></i>
      </button>

      <div class="ms-auto d-flex align-items-center gap-3">
        <div class="d-flex align-items-center gap-2">
          <label class="small text-muted mb-0" for="languageSelect">{{ 'common.language' | translate }}</label>
          <select
            id="languageSelect"
            class="form-select form-select-sm language-select"
            [ngModel]="locale.currentLanguage().code"
            (ngModelChange)="onLanguageChange($event)">
            @for (lang of locale.languages; track lang.code) {
              <option [value]="lang.code">{{ lang.label }}</option>
            }
          </select>
        </div>

        @if (currentUser(); as user) {
          <div class="text-end d-none d-sm-block">
            <div class="fw-semibold small">{{ user.firstName }} {{ user.lastName }}</div>
            <div class="text-muted small">{{ user.email }}</div>
          </div>
          <button type="button" class="btn btn-outline-danger btn-sm" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i>{{ 'auth.logout' | translate }}
          </button>
        }
      </div>
    </nav>

    <main class="shell-content flex-grow-1 p-3 p-md-4 bg-light">
      <router-outlet />
    </main>
  </div>
</div>

<app-create-academic-year-modal />
