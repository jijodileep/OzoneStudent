name: CI — API

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: schoolsaas_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Test
        env:
          ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=schoolsaas_test;User=root;Password=password;
          ConnectionStrings__Redis: 127.0.0.1:6379,abortConnect=false
          Redis__ConnectionString: 127.0.0.1:6379,abortConnect=false
          Outbox__Enabled: "false"
        run: |
          dotnet test tests/SchoolSaaS.UnitTests/SchoolSaaS.UnitTests.csproj -c Release --verbosity normal --logger "trx;LogFileName=unit-tests.trx"
          dotnet test tests/SchoolSaaS.ArchitectureTests/SchoolSaaS.ArchitectureTests.csproj -c Release --verbosity normal --logger "trx;LogFileName=architecture-tests.trx"
          dotnet test tests/SchoolSaaS.IntegrationTests/SchoolSaaS.IntegrationTests.csproj -c Release --verbosity normal --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"
